name: Release

# Tag-triggered crates.io publication through trusted publishing (OIDC); no
# stored registry token. The crates.io trusted-publisher rule names this file,
# so keep the path .github/workflows/release.yml. Re-running for an existing
# tag is safe: a version already on crates.io is skipped, and the GitHub
# release is only created when missing.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)publish, for example v0.1.1
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RUSTUP_TOOLCHAIN: stable

jobs:
  crates-io:
    name: Publish to crates.io
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check the tag format
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::Not a release tag: $RELEASE_TAG"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Require tag == v + Cargo.toml version
        id: crate
        run: |
          read -r name version < <(python3 -c 'import tomllib; p = tomllib.load(open("Cargo.toml", "rb"))["package"]; print(p["name"], p["version"])')
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match Cargo.toml version $version"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Skip a version that is already on crates.io
        id: registry
        env:
          CRATE: ${{ steps.crate.outputs.name }}
          VERSION: ${{ steps.crate.outputs.version }}
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --user-agent "$GITHUB_REPOSITORY release workflow ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/$CRATE/$VERSION")
          case "$status" in
            200) echo "$CRATE $VERSION is already on crates.io; skipping publish"; echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::crates.io lookup returned HTTP $status"; exit 1 ;;
          esac
      - name: Set up current stable Rust
        if: steps.registry.outputs.published == 'false'
        run: rustup toolchain install stable --profile minimal

      - name: Dry-run the package
        if: steps.registry.outputs.published == 'false'
        run: cargo publish --locked --dry-run

      - name: Obtain a short-lived crates.io token
        if: steps.registry.outputs.published == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        if: steps.registry.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  github-release:
    name: Create the GitHub release
    needs: crates-io
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the release if it is missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
            exit 0
          fi
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --title "$RELEASE_TAG" "${prerelease[@]}"
