[package]
name = "ccti"
version = "0.1.9"
edition = "2024"
rust-version = "1.89"
description = "ComfyUI TUI: agentic image chat with inline terminal rendering"
repository = "https://github.com/corbet-labs/ccti"
license = "FSL-1.1-ALv2"
keywords = ["tui", "comfyui", "image-generation", "agent"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
base64 = "0.22"
ccht = "0.2.8"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "0.18"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "macros"] }
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "io-util", "io-std", "fs"] }
